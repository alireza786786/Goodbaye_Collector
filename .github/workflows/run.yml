name: Goodbaye Collector Master Pipeline

on:
  schedule:
    # اجرا خودکار هر ۲ ساعت یکبار
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies & Download City DB
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ ! -f GeoLite2-City.mmdb ] || [ $(stat -c%s "GeoLite2-City.mmdb") -lt 5000000 ]; then
            echo "Downloading GeoLite2-City Database..."
            curl -L -o GeoLite2-City.mmdb https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-City.mmdb || true
          fi

      - name: 1. Run Goodbaye Master Engine (V2Ray + Telegram + Retention)
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
          CHANNELS_LIST: ${{ secrets.CHANNELS_LIST }}
        run: python main.py

      - name: 2. Run Web Dashboard Generator
        run: python web_generator.py

      - name: 3. Setup No-Jekyll for GitHub Pages
        run: touch .nojekyll

      - name: 4. Sync, Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-Update: Subscriptions & Web Panel [skip ci]" && git push)
